
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Administrador - Embrapa</title>

    <link rel="stylesheet" href="../../../public/css/main.css">
</head>

<body>

<header class="header">
    <div class="container">

        <a href="#" class="logo">
            <span class="logo__nome">Embrapa</span>
        </a>

        <nav aria-label="Principal">
            <ul class="abas">
                <li><span>Administrador</span></li>
                <li><a href="#">Sair</a></li>
            </ul>
        </nav>

    </div>
</header>

<main>

    <div class="container">

        <section class="administrador">

            <h1>Painel do Administrador</h1>

            <p class="descricao">
                Gerencie os usuários cadastrados no sistema.
            </p>

            <!-- CADASTRAR NOVO USUÁRIO -->
            <details class="funcao">

                <summary>Cadastrar Novo Usuário</summary>

                <div class="conteudo-funcao">

                    <form id="formCadastro">

                        <div class="campos">

                            <div class="campo">
                                <label for="nome">Nome completo</label>
                                <input type="text" id="nome"
                                    placeholder="Digite o nome completo"
                                    required>
                            </div>

                            <div class="campo">
                                <label for="matricula">Matrícula</label>
                                <input type="text" id="matricula"
                                    placeholder="Digite a matrícula"
                                    required>
                            </div>

                            <div class="campo">
                                <label for="email">E-mail</label>
                                <input type="email" id="email"
                                    placeholder="Digite o e-mail"
                                    required>
                            </div>

                            <div class="campo">
                                <label for="cargo">Cargo</label>
                                <input type="text" id="cargo"
                                    placeholder="Digite o cargo"
                                    required>
                            </div>

                        </div>

                        <button type="submit" class="btn salvar">
                            Cadastrar Usuário
                        </button>

                    </form>

                </div>

            </details>

            <!-- LISTAR E GERENCIAR USUÁRIOS -->
            <details class="funcao" open>

                <summary>Listar Todos os Usuários</summary>

                <div class="conteudo-funcao">

                    <div class="tabela-responsiva">

                        <table>

                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Matrícula</th>
                                    <th>E-mail</th>
                                    <th>Cargo</th>
                                    <th>Situação</th>
                                    <th></th>
                                </tr>
                            </thead>

                            <tbody id="listaUsuarios">
                            </tbody>

                        </table>

                    </div>

                    <!-- FORMULÁRIO DE EDIÇÃO -->
                    <div id="areaEdicao" class="area-edicao" hidden>

                        <h3>Editar Cadastro de Usuário</h3>

                        <form id="formEditar">

                            <input type="hidden" id="editarId">

                            <div class="campos">

                                <div class="campo">
                                    <label for="editarNome">
                                        Nome completo
                                    </label>

                                    <input type="text" id="editarNome"
                                        required>
                                </div>

                                <div class="campo">
                                    <label for="editarMatricula">
                                        Matrícula
                                    </label>

                                    <input type="text" id="editarMatricula"
                                        required>
                                </div>

                                <div class="campo">
                                    <label for="editarEmail">
                                        E-mail
                                    </label>

                                    <input type="email" id="editarEmail"
                                        required>
                                </div>

                                <div class="campo">
                                    <label for="editarCargo">
                                        Cargo
                                    </label>

                                    <input type="text" id="editarCargo"
                                        required>
                                </div>

                            </div>

                            <div class="botoes-edicao">

                                <button type="submit" class="btn salvar">
                                    Salvar Alterações
                                </button>

                                <button type="button"
                                    class="btn cancelar"
                                    id="cancelarEdicao">
                                    Cancelar
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </details>

        </section>

    </div>

</main>

<footer class="footer">

    <div class="container">
        <span>© Embrapa – Trabalho do Mauricio</span>
        <a href="#">Política de privacidade</a>
    </div>

</footer>

</body>
</html>
