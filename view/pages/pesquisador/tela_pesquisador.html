
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Minhas Ações - Embrapa</title>

    <link rel="stylesheet" href="../../../public/css/main.css">
</head>

<body>

<header class="header">
    <div class="container">

        <a href="#" class="logo">
            <span class="logo__nome">Embrapa</span>
        </a>

        <nav aria-label="Principal">
            <ul class="abas">
                <li><span>Pesquisador</span></li>
                <li><a href="../auth.php?acao=sair">Sair</a></li>
            </ul>
        </nav>

    </div>
</header>

<main>

    <div class="container">

        <section class="pesquisador" id="acoes">

            <h1>Minhas Ações</h1>

            <p class="descricao">
                Consulte e gerencie suas ações cadastradas no sistema.
            </p>

            <!-- CRIAR NOVA AÇÃO -->

            <details class="funcao funcao--criar">

                <summary>Criar Nova Ação</summary>

                <div class="conteudo-funcao">

                    <form class="pesquisador-formulario" id="formulario-acao">

                        <div class="campos">

                            <div class="campo">
                                <label for="titulo_acao">Título da ação</label>
                                <input
                                    type="text"
                                    id="titulo_acao"
                                    name="titulo_acao"
                                    placeholder="Digite o título da ação"
                                    maxlength="100"
                                    required
                                >
                            </div>

                            <div class="campo">
                                <label for="tipo_acao">Tipo da ação</label>
                                <select
                                    id="tipo_acao"
                                    name="tipo_acao"
                                    required
                                >
                                    <option value="">Selecione o tipo</option>
                                    <option value="local">Coordenação de eventos LOCAL</option>
                                    <option value="nacional">Coordenação de evento NACIONAL</option>
                                    <option value="regional">Coordenação de evento REGIONAL</option>
                                </select>
                            </div>

                            <div class="campo">
                                <label for="data_realizacao">Data de realização</label>
                                <input
                                    type="date"
                                    id="data_realizacao"
                                    name="data_realizacao"
                                    required
                                >
                            </div>

                            <div class="campo">
                                <label for="descricao_acao">Descrição da ação</label>
                                <textarea
                                    id="descricao_acao"
                                    name="descricao_acao"
                                    placeholder="Descreva os detalhes da ação"
                                    maxlength="300"
                                    required
                                ></textarea>
                            </div>

                        </div>

                        <div class="pesquisador-formulario__acoes">
                            <button type="submit" class="btn salvar">
                                Cadastrar Ação
                            </button>
                        </div>

                    </form>

                </div>

            </details>

            <!-- LISTAR MINHAS AÇÕES -->

            <details class="funcao funcao--lista" open>

                <summary>Listar Minhas Ações</summary>

                <div class="conteudo-funcao conteudo-funcao--lista">

                    <div class="tabela-responsiva">

                        <table>

                            <thead>
                                <tr>
                                    <th>Título da ação</th>
                                    <th>Tipo da ação</th>
                                    <th>Data de realização</th>
                                    <th>Status</th>
                                </tr>
                            </thead>

                            <tbody id="lista-acoes">
                                <tr><td colspan="4">Carregando ações...</td></tr>
                            </tbody>

                        </table>

                    </div>

                </div>

            </details>

            <p id="mensagem-acoes" role="status" aria-live="polite"></p>

        </section>

    </div>

</main>

<footer class="footer">

    <div class="container">
        <span>© Embrapa – Trabalho do Mauricio</span>

        <a href="#">Política de privacidade</a>
    </div>

</footer>

<script>
    const endpointAcoes = './acoes.php';
    const corpoTabela = document.getElementById('lista-acoes');
    const mensagemAcoes = document.getElementById('mensagem-acoes');
    const formularioCriacao = document.getElementById('formulario-acao');
    const categorias = {
        local: 'Coordenação de eventos LOCAL',
        nacional: 'Coordenação de evento NACIONAL',
        regional: 'Coordenação de evento REGIONAL',
        'Coordenação de eventos LOCAL': 'Coordenação de eventos LOCAL',
        'Coordenação de evento NACIONAL': 'Coordenação de evento NACIONAL',
        'Coordenação de evento REGIONAL': 'Coordenação de evento REGIONAL'
    };

    async function requisitar(url, opcoes = {}) {
        const resposta = await fetch(url, {
            ...opcoes,
            headers: { 'Content-Type': 'application/json', ...(opcoes.headers || {}) }
        });
        const dados = await resposta.json();
        if (!resposta.ok) throw new Error(dados.erro || 'Não foi possível concluir a operação.');
        return dados;
    }

    function mostrarMensagem(texto, erro = false) {
        mensagemAcoes.textContent = texto;
        mensagemAcoes.setAttribute('role', erro ? 'alert' : 'status');
    }

    function valorStatus(status) {
        return status === 'Pendente' ? ['Em análise', 'analise'] : [status, status.toLowerCase()];
    }

    function renderizarAcoes(acoes) {
        corpoTabela.replaceChildren();
        if (acoes.length === 0) {
            const linha = document.createElement('tr');
            const celula = document.createElement('td');
            celula.colSpan = 4;
            celula.textContent = 'Você ainda não cadastrou ações.';
            linha.append(celula);
            corpoTabela.append(linha);
            return;
        }

        for (const acao of acoes) {
            const linha = document.createElement('tr');
            for (const texto of [
                acao.titulo,
                categorias[acao.categoria_acao] || acao.categoria_acao,
                new Date(`${acao.data_realizacao}T00:00:00`).toLocaleDateString('pt-BR')
            ]) {
                const celula = document.createElement('td');
                celula.textContent = texto;
                linha.append(celula);
            }

            const celulaStatus = document.createElement('td');
            const [textoStatus, classeStatus] = valorStatus(acao.status);
            const etiqueta = document.createElement('span');
            etiqueta.className = `status ${classeStatus}`;
            etiqueta.textContent = textoStatus;
            celulaStatus.append(etiqueta);
            linha.append(celulaStatus);

            corpoTabela.append(linha);
        }
    }

    async function carregarAcoes() {
        try {
            const dados = await requisitar(endpointAcoes);
            renderizarAcoes(dados.acoes || []);
        } catch (erro) {
            corpoTabela.replaceChildren();
            const linha = document.createElement('tr');
            const celula = document.createElement('td');
            celula.colSpan = 4;
            celula.textContent = erro.message;
            linha.append(celula);
            corpoTabela.append(linha);
        }
    }

    function dadosFormulario(formulario) {
        return Object.fromEntries(new FormData(formulario).entries());
    }

    formularioCriacao.addEventListener('submit', async (evento) => {
        evento.preventDefault();
        try {
            const dados = await requisitar(endpointAcoes, {
                method: 'POST',
                body: JSON.stringify(dadosFormulario(formularioCriacao))
            });
            formularioCriacao.reset();
            mostrarMensagem(dados.mensagem);
            await carregarAcoes();
        } catch (erro) {
            mostrarMensagem(erro.message, true);
        }
    });

    carregarAcoes();
</script>

</body>
</html>
