<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar ação</title>
    <link rel="stylesheet" href="../../../public/css/main.css">
</head>
<body class="pagina-popup">
    <main class="pesquisador-pop-up-fundo">
        <section class="pesquisador-pop-up-edicao" role="dialog" aria-modal="true"
            aria-labelledby="titulo-editar-acao">
            <h1 id="titulo-editar-acao">Editar Ação</h1>

            <form>
                <div class="pesquisador-pop-up-edicao__campos">
                    <div class="pesquisador-pop-up-edicao__campo">
                        <label for="editar-titulo">Título da ação</label>
                        <input type="text" id="editar-titulo"
                            value="Desempenho de bovinos" required>
                    </div>

                    <div class="pesquisador-pop-up-edicao__campo">
                        <label for="editar-tipo">Tipo da ação</label>
                        <select id="editar-tipo" required>
                            <option>Coordenação de eventos LOCAL</option>
                            <option>Coordenação de evento NACIONAL</option>
                            <option>Coordenação de evento REGIONAL</option>
                        </select>
                    </div>

                    <div class="pesquisador-pop-up-edicao__campo">
                        <label for="editar-data">Data de realização</label>
                        <input type="date" id="editar-data"
                            value="2026-05-29" required>
                    </div>

                    <div class="pesquisador-pop-up-edicao__campo">
                        <label for="editar-descricao">Descrição</label>
                        <textarea id="editar-descricao" rows="4" required>Ação relacionada ao desempenho de bovinos.</textarea>
                    </div>
                </div>

                <div class="pesquisador-pop-up-edicao__acoes">
                    <button type="button" class="btn cancelar pesquisador-pop-up-btn" onclick="parent.fecharPopup()">Cancelar</button>
                    <button type="button" class="btn pesquisador-pop-up-btn pesquisador-pop-up-edicao__confirmar">
                        Salvar Alterações
                    </button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
