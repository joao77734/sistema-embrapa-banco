<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tela de Logn</title>
  <link rel="stylesheet" href="../../public/css/main.css">
  <link rel="stylesheet" href="../../modelos/base.css">
</head>
<body>

<header class="header">
  <div class="container">
    <a href="#" class="logo" aria-label="Página inicial da Embrapa">
      <span class="logo__nome">Embrapa</span>
    </a>
  </div>
</header>

<main class="login-main">
    
  <div class="login-card">
    <h2>Entre no Sistema</h2>
    <p>Insira suas informações para entrar</p>
    
    <form action="#" method="POST" class="login-form">
      <div class="input-group">
        <label for="usuario">E-mail</label>
        <input type="text" id="usuario" name="usuario" placeholder="Digite o seu email" required>
      </div>

      <div class="input-group">
          <label for="pin">PIN</label>
          <input type="password" id="pin" name="pin" inputmode="numeric" placeholder="Digite seu PIN" required>
      </div>

      <button type="submit" class="btn-login">Entrar</button>
    </form>
  </div>

</main>

<footer class="footer">
  <div class="container">
    <span>© Embrapa – Trabalho do Mauricio</span>
    <a href="#">Política de privacidade</a>
  </div>
</footer>

</body>
</html>
