<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliar ação</title>
    <link rel="stylesheet" href="../../../public/css/main.css">
</head>
<body class="pagina-popup">
    <main class="validador-pop-up-fundo">
        <section class="validador-pop-up-avaliacao" role="dialog" aria-modal="true"
            aria-labelledby="titulo-avaliar-acao" aria-describedby="aviso-avaliar-acao">
            <div class="validador-pop-up-avaliacao__icone" aria-hidden="true">?</div>
            <h1 id="titulo-avaliar-acao">Avaliar ação</h1>
            <p id="aviso-avaliar-acao">
                Deseja aprovar a ação?
            </p>
            <p class="validador-pop-up-avaliacao__nome">
                <strong>Nome da Ação</strong>
            </p>
            <div class="validador-pop-up-avaliacao__acoes">
                <button type="button" class="btn cancelar validador-pop-up-btn">Cancelar</button>
                <button type="button" class="btn validador-pop-up-btn validador-pop-up-avaliacao__recusar">
                    Recusar Ação
                </button>
                <button type="button" class="btn validador-pop-up-btn validador-pop-up-avaliacao__aprovar">
                    Aprovar
                </button>
            </div>
        </section>
    </main>
</body>
</html>
